# Lint and run the whole test suite against a real MariaDB 11.8 on every push and pull request.
# The credentials below exist only inside this throwaway CI container.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: ci-root-password
          MARIADB_DATABASE: wikilense
          MARIADB_USER: wikilense
          MARIADB_PASSWORD: ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    env:
      WIKILENSE_DB_HOST: 127.0.0.1
      WIKILENSE_DB_PORT: "3306"
      WIKILENSE_DB_NAME: wikilense
      WIKILENSE_DB_USER: wikilense
      WIKILENSE_DB_PASSWORD: ci-password
      WIKILENSE_TEST_DB_NAME: wikilense_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-small-en-v1.5

      - name: Install dependencies (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Create the test database
        run: |
          docker exec ${{ job.services.mariadb.id }} mariadb -uroot -pci-root-password \
            -e "CREATE DATABASE IF NOT EXISTS wikilense_test; GRANT ALL PRIVILEGES ON wikilense_test.* TO 'wikilense'@'%'; FLUSH PRIVILEGES;"
          docker exec ${{ job.services.mariadb.id }} mariadb -uroot -pci-root-password -e "SELECT VERSION();"

      - name: Lint
        run: ruff check .

      - name: Test
        run: python -m pytest -q -rs
