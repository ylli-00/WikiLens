# Lint and run the whole test suite against a real MariaDB 11.8 on every push and pull request.
# Dependencies are installed from requirements-cpu.lock, so the lock file is exercised each run.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Throwaway credentials, defined once here and referenced below; they exist only inside this
    # job's MariaDB service container. The names are the ones .env.example uses.
    env:
      WIKILENSE_DB_HOST: 127.0.0.1
      WIKILENSE_DB_PORT: "3306"
      WIKILENSE_DB_NAME: wikilense
      WIKILENSE_DB_USER: wikilense
      WIKILENSE_DB_PASSWORD: ci-password
      WIKILENSE_DB_ROOT_PASSWORD: ci-root-password
      WIKILENSE_TEST_DB_NAME: wikilense_test

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: ${{ env.WIKILENSE_DB_ROOT_PASSWORD }}
          MARIADB_DATABASE: ${{ env.WIKILENSE_DB_NAME }}
          MARIADB_USER: ${{ env.WIKILENSE_DB_USER }}
          MARIADB_PASSWORD: ${{ env.WIKILENSE_DB_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-cpu.lock

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-small-en-v1.5

      - name: Install the pinned CPU-only dependencies and the package
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cpu.lock
          pip install -e .

      - name: Create the test database
        # The root password reaches the client as MYSQL_PWD: `docker exec -e MYSQL_PWD` names the
        # variable and docker copies its value from this step's environment, so the password is
        # on no command line (the same route scripts/run_experiments.py takes).
        env:
          MYSQL_PWD: ${{ env.WIKILENSE_DB_ROOT_PASSWORD }}
        run: |
          docker exec -e MYSQL_PWD ${{ job.services.mariadb.id }} mariadb -uroot \
            -e "CREATE DATABASE IF NOT EXISTS $WIKILENSE_TEST_DB_NAME; GRANT ALL PRIVILEGES ON $WIKILENSE_TEST_DB_NAME.* TO '$WIKILENSE_DB_USER'@'%'; FLUSH PRIVILEGES;"
          docker exec -e MYSQL_PWD ${{ job.services.mariadb.id }} mariadb -uroot -e "SELECT VERSION();"

      - name: Lint
        run: ruff check .

      - name: Test
        # The service and the cached model are there, so a db or slow test must run, not skip:
        # tests/conftest.py turns a skip reason into an error when these are set.
        env:
          WIKILENSE_REQUIRE_DB: "1"
          WIKILENSE_REQUIRE_MODEL: "1"
        run: python -m pytest -q -rs
