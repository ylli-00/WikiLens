# WikiLense pinned dependencies, CPU-only build (CI and machines without an NVIDIA GPU).
# Made on 2026-09-17 in a throwaway venv (Python 3.12.3, pip 24.0, Linux x86_64) with:
#   python3 -m venv cpu-venv
#   cpu-venv/bin/pip install torch --index-url https://download.pytorch.org/whl/cpu
#   cpu-venv/bin/pip install -r requirements-dev.txt
#   cpu-venv/bin/pip freeze --exclude-editable
# Use: python3 -m venv .venv && .venv/bin/pip install -r requirements-cpu.lock -e .
# (`make setup CPU=1` does this). .github/workflows/ci.yml installs from this file. With an
# NVIDIA GPU on Linux use requirements.lock, the CUDA build that produced the numbers in results/.
#
# Platforms (edited by hand on 2026-11-11; the two torch lines and colorama carry markers).
# torch is the only pin that differs by platform:
#   - Linux and Windows: torch==2.14.0+cpu, from the PyTorch CPU index named below.
#   - macOS: torch==2.14.0. PyTorch publishes no "+cpu" build for macOS; its macOS wheel is
#     the CPU build already. That wheel exists for Apple Silicon and macOS 14 or newer only.
# colorama is needed on Windows only (pytest, tqdm and typer ask for it there).
# Needs Python 3.12 or newer (numpy 2.5.3 needs 3.12, networkx 3.6.1 needs 3.11).
# Does not resolve on an Intel Mac or on macOS 13: torch 2.14.0 has no wheel for them (the
# newest torch there is 2.2.2 and 2.11.0).
# docs/SETUP.md, "Platforms", says what was run, what was only resolved, and what to do elsewhere.
--extra-index-url https://download.pytorch.org/whl/cpu
