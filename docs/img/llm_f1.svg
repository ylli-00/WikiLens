<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img" aria-labelledby="t d"><title id="t">F1 per label, supported and refuted claims</title><desc id="d">F1 per label. no passages: supported 43.5 (40.3 to 46.8), refuted 53.9 (50.7 to 56.9); web search: supported 83.9 (82.1 to 85.6), refuted 84.4 (82.6 to 86.1); RAG: supported 88.2 (86.6 to 89.7), refuted 85.6 (83.8 to 87.2); gold passages: supported 90.5 (89.0 to 91.8), refuted 85.1 (83.3 to 86.7).</desc><style>
