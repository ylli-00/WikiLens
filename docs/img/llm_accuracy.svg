<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="t d"><title id="t">LLM fact-checker accuracy, Claude Haiku 5.5</title><desc id="d">Accuracy with 95% intervals. three classes (3,000 claims): no passages 45.2% (43.4 to 47.0); web search 61.3% (59.5 to 63.0); RAG 70.9% (69.2 to 72.5); gold passages 72.9% (71.2 to 74.4). supported/refuted only (2,000 claims): no passages 35.3% (33.2 to 37.4); web search 81.9% (80.2 to 83.5); RAG 83.6% (81.9 to 85.2); gold passages 82.9% (81.1 to 84.4).</desc><style>
svg { --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781; --grid: #e1e0d9;
      --axis: #c3c2b7; --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; }
@media (prefers-color-scheme: dark) {
  svg { --surface: #1a1a19; --ink: #ffffff; --ink2: #c3c2b7; --muted: #898781; --grid: #2c2c2a;
        --axis: #383835; --s1: #3987e5; --s2: #d95926; --s3: #199e70; }
}
.bg { fill: var(--surface); }
text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 12px; }
.title { fill: var(--ink); font-size: 15px; font-weight: 600; }
.subtitle { fill: var(--ink2); font-size: 12px; }
.tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.label { fill: var(--ink); font-size: 12px; }
.grid { stroke: var(--grid); stroke-width: 1; }
.axis { stroke: var(--axis); stroke-width: 1; }
.s1 { fill: var(--s1); } .s2 { fill: var(--s2); } .s3 { fill: var(--s3); }
.line1 { stroke: var(--s1); } .line2 { stroke: var(--s2); } .line3 { stroke: var(--s3); }
.line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.dot { stroke: var(--surface); stroke-width: 2; }
