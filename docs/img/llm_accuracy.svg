e x1="607.3" y1="94.0" x2="607.3" y2="260.0" class="grid"/><text x="607.3" y="278.0" class="tick" text-anchor="middle" dominant-baseline="auto">70%</text><line x1="651.7" y1="94.0" x2="651.7" y2="260.0" class="grid"/><text x="651.7" y="278.0" class="tick" text-anchor="middle" dominant-baseline="auto">80%</text><line x1="696.0" y1="94.0" x2="696.0" y2="260.0" class="grid"/><text x="696.0" y="278.0" class="tick" text-anchor="middle" dominant-baseline="auto">90%</text><path d="M444.1,114.0 V126.0 M444.1,120.0 H462.7 M462.7,114.0 V126.0" class="line line1" style="stroke-width: 2.5"/><circle class="dot s1" cx="453.3" cy="120.0" r="4"><title>no passages: 35.3% (33.2 to 37.4), 705 of 2,000</title></circle><text x="470.7" y="120.0" class="label" text-anchor="start" dominant-baseline="middle">35.3%</text><path d="M652.3,154.0 V166.0 M652.3,160.0 H667.3 M667.3,154.0 V166.0" class="line line1" style="stroke-width: 2.5"/><circle class="dot s1" cx="660.1" cy="160.0" r="4"><title>web search: 81.9% (80.2 to 83.5), 1,638 of 2,000</title></circle><text x="675.3" y="160.0" class="label" text-anchor="start" dominant-baseline="middle">81.9%</text><path d="M660.1,194.0 V206.0 M660.1,200.0 H674.5 M674.5,194.0 V206.0" class="line line1" style="stroke-width: 2.5"/><circle class="dot s1" cx="667.6" cy="200.0" r="4"><title>RAG: 83.6% (81.9 to 85.2), 1,672 of 2,000</title></circle><text x="682.5" y="200.0" class="label" text-anchor="start" dominant-baseline="middle">83.6%</text><path d="M656.7,234.0 V246.0 M656.7,240.0 H671.3 M671.3,234.0 V246.0" class="line line1" style="stroke-width: 2.5"/><circle class="dot s1" cx="664.3" cy="240.0" r="4"><title>gold passages: 82.9% (81.1 to 84.4), 1,657 of 2,000</title></circle><text x="679.3" y="240.0" class="label" text-anchor="start" dominant-baseline="middle">82.9%</text></svg>
