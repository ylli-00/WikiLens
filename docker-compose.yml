# MariaDB 11.8 LTS for WikiLense. Usage: cp .env.example .env, edit the passwords, docker compose up -d
services:
  mariadb:
    image: mariadb:11.8
    container_name: wikilense-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${WIKILENSE_DB_ROOT_PASSWORD:?set WIKILENSE_DB_ROOT_PASSWORD in .env}
      MARIADB_DATABASE: ${WIKILENSE_DB_NAME:-wikilense}
      MARIADB_USER: ${WIKILENSE_DB_USER:-wikilense}
      MARIADB_PASSWORD: ${WIKILENSE_DB_PASSWORD:?set WIKILENSE_DB_PASSWORD in .env}
    # The HNSW index cache (mhnsw_max_cache_size) defaults to 16 MB; the M=6 graph of the 120-word
    # ingest (8,658 chunks) is already 16 MB on disk and the final 240-word graph 13 MB, so 512 MB is
    # set for capacity. The size does not change the results: within one server process the hit
    # lists were identical at 512 MB and 16 MB (75 of 75 claims); a server restart is what changed
    # them (3 of 75 on the M=6 index, 1 of 75 on M=16), see results/SUMMARY.md sections 1 and 7.
    command: --mhnsw-max-cache-size=536870912
    ports:
      # Loopback only: the database is reachable from this machine, not from the network.
      - "127.0.0.1:${WIKILENSE_DB_PORT:-3306}:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./sql/docker-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mariadb-data:
