[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wikilense"
version = "0.1.0"
description = "Semantic search over Wikipedia inside MariaDB: VECTOR columns, VECTOR INDEX, VEC_DISTANCE_COSINE plus ordinary SQL."
requires-python = ">=3.10"
dependencies = [
  "sentence-transformers>=3.0",
  "torch>=2.2",
  "PyMySQL>=1.1",
  "python-dotenv>=1.0",
  "tqdm>=4.66",
  "numpy>=1.26",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
wikilense = "wikilense.cli:main"

[tool.setuptools.packages.find]
include = ["wikilense*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"  # a mistyped marker (e.g. @pytest.mark.dbb) is an error, not a skip-free test
markers = [
  "db: needs a running MariaDB (skipped when WIKILENSE_DB_* is not reachable)",
  "slow: downloads or runs the embedding model",
]
# Two deprecation notices raised inside third-party packages at import time, not by our code:
# starlette's TestClient (used by tests/test_web.py) about httpx, and starlette about an anyio alias.
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
